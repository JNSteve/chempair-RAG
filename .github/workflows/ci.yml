name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test-light:
    name: Tests (no RAG stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest pyyaml
      - name: Run dependency-light suites
        run: >
          python -m pytest
          tests/test_eval_scoring.py
          tests/test_golden_questions_schema.py
          tests/test_corpus_manifest.py
          tests/test_ingest_pipeline.py
          tests/test_citation_extraction.py
          tests/test_retrieval_eval.py
          tests/test_kb_info.py
          tests/test_session_store.py
          tests/test_dockerfile_completeness.py
          -q

  test-full:
    name: Tests (full server suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q
